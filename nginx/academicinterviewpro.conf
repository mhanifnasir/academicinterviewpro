# ==============================================================================
# Academic Interview Pro — Production Nginx Configuration
# Target: Azure Ubuntu 24.04 LTS VPS
# Domain: academicinterviewpro.pk / www.academicinterviewpro.pk
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general_rate_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/m;

# Upstream Next.js application cluster managed by PM2
upstream nextjs_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# HTTP — Redirect all non-SSL traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name academicinterviewpro.pk www.academicinterviewpro.pk;

    # Let's Encrypt ACME challenge endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Core Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name academicinterviewpro.pk www.academicinterviewpro.pk;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/academicinterviewpro.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academicinterviewpro.pk/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/academicinterviewpro.pk/chain.pem;

    # Modern TLS Security Configuration (TLSv1.2 & TLSv1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # Compression Configuration (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Client body and file upload ceilings (50MB for video teaching demonstrations)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Next.js Static Assets & Media (Immutable 1-Year Cache)
    location /_next/static/ {
        alias /var/www/academicinterviewpro/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Directory Static Assets
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|eot|svg)$ {
        root /var/www/academicinterviewpro/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Authentication Rate Limiting
    location /api/auth/ {
        limit_req zone=auth_rate_limit burst=10 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # High-Compute API Endpoints (AI Interviews, Coding Sandbox, Teaching Eval)
    location /api/ {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Application Gateway & Dynamic SSR Pages
    location / {
        limit_req zone=general_rate_limit burst=50 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
